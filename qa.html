<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Values in {{…}} are filled from src/data/profile.ts at build time (see vite.config.ts). -->
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <meta name="keywords" content="{{KEYWORDS}}" />
    <meta name="author" content="{{NAME}}" />
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121416" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="{{PAGE_URL}}" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="{{NAME}}" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:url" content="{{PAGE_URL}}" />
    <meta property="og:image" content="{{OG_IMAGE}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{NAME}}, {{ROLE}}" />
    <meta property="og:locale" content="en_IN" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{TITLE}}" />
    <meta name="twitter:description" content="{{DESCRIPTION}}" />
    <meta name="twitter:image" content="{{OG_IMAGE}}" />

    <script type="application/ld+json">{{JSON_LD}}</script>
  </head>
  <body>
    <noscript>
      <main style="max-width: 40rem; margin: 4rem auto; padding: 0 1.25rem; font-family: Georgia, serif; color: #17191c; background: #f7f7f5; line-height: 1.6">
        <h1>{{NAME}}, {{ROLE}}</h1>
        <p>{{INTRO}}</p>
        <p>
          <a style="color: #1f5f8b" href="mailto:{{EMAIL}}">{{EMAIL}}</a> ·
          <a style="color: #1f5f8b" href="{{GITHUB}}">GitHub</a> ·
          <a style="color: #1f5f8b" href="{{LINKEDIN}}">LinkedIn</a> ·
          <a style="color: #1f5f8b" href="{{RESUME}}">Resume (PDF)</a>
        </p>
        <p>This site needs JavaScript for the full experience.</p>
      </main>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/qa.tsx"></script>
  </body>
</html>
